  <rect x="18" y="3" width="1" height="7"/>
  <rect x="9" y="4" width="1" height="1"/>
  <rect x="14" y="4" width="1" height="1"/>
  <rect x="8" y="5" width="1" height="3"/>
  <rect x="15" y="5" width="1" height="3"/>
  <rect x="9" y="8" width="1" height="1"/>
  <rect x="14" y="8" width="1" height="1"/>
  <rect x="6" y="10" width="1" height="1"/>
  <rect x="17" y="10" width="1" height="1"/>
  <rect x="10" y="20" width="1" height="1"/>
  <rect x="13" y="20" width="1" height="1"/>
  <rect x="9" y="21" width="2" height="2"/>
  <rect x="13" y="21" width="2" height="2"/>
