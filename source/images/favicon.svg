<svg xmlns="http://www.w3.org/2000/svg" viewBox="1 0 22 22"
     role="img" aria-label="Wavepick" shape-rendering="crispEdges">
  <!-- The set, its aerials and the play mark, on a 24-cell grid. The play
       mark is cut out rather than painted, so it shows whatever is behind the
       icon and reads on a light page as well as a dark one. -->
  <defs>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff4d6d"/>
      <stop offset="100%" stop-color="#ff9f1c"/>
    </linearGradient>
    <mask id="screen">
      <rect x="4" y="0" width="2" height="2" fill="#fff"/>
      <rect x="18" y="0" width="2" height="2" fill="#fff"/>
      <rect x="5" y="2" width="1" height="1" fill="#fff"/>
      <rect x="18" y="2" width="1" height="1" fill="#fff"/>
      <rect x="6" y="3" width="1" height="2" fill="#fff"/>
      <rect x="17" y="3" width="1" height="2" fill="#fff"/>
      <rect x="7" y="5" width="1" height="2" fill="#fff"/>
      <rect x="16" y="5" width="1" height="2" fill="#fff"/>
      <rect x="8" y="7" width="1" height="1" fill="#fff"/>
      <rect x="15" y="7" width="1" height="1" fill="#fff"/>
      <rect x="6" y="8" width="12" height="1" fill="#fff"/>
      <rect x="5" y="9" width="14" height="12" fill="#fff"/>
      <rect x="4" y="10" width="1" height="1" fill="#fff"/>
      <rect x="19" y="10" width="1" height="1" fill="#fff"/>
      <rect x="3" y="11" width="2" height="8" fill="#fff"/>
      <rect x="19" y="11" width="2" height="8" fill="#fff"/>
      <rect x="4" y="19" width="1" height="1" fill="#fff"/>
      <rect x="19" y="19" width="1" height="1" fill="#fff"/>
      <rect x="6" y="21" width="12" height="1" fill="#fff"/>
      <rect x="8" y="10" width="2" height="2" fill="#000"/>
      <rect x="10" y="12" width="2" height="2" fill="#000"/>
      <rect x="12" y="14" width="2" height="2" fill="#000"/>
      <rect x="10" y="16" width="2" height="2" fill="#000"/>
      <rect x="8" y="18" width="2" height="2" fill="#000"/>
    </mask>
  </defs>
  <rect x="1" y="0" width="22" height="22" fill="url(#mark)" mask="url(#screen)"/>
</svg>
