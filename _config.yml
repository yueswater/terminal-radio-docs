# Site
title: terminal-radio
subtitle: FM · AM · Taiwan
description: Terminal radio player for Taiwanese FM and AM stations, with a Textual UI and a FastAPI control API
keywords: radio, terminal, tui, textual, taiwan, fm, am, mpv
author: Anthony Sung
# The first entry is the default. Pages under source/en/ set their own.
language:
  - zh-TW
  - en
timezone: Asia/Taipei

# URL
url: https://radio.yueswater.com
permalink: :title/
permalink_defaults:
pretty_urls:
  trailing_index: false
  trailing_html: false

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# Writing
new_post_name: :title.md
default_layout: page
titlecase: false
external_link:
  enable: true
  field: site
  exclude:
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
syntax_highlighter: highlight.js
highlight:
  line_number: false
  auto_detect: false
  tab_replace: '  '

# No home page is generated: source/index.md is the home page.

# Date / Time format
date_format: YYYY-MM-DD
time_format: HH:mm
updated_option: 'mtime'

# Pagination. A landing page has nothing to page through.
per_page: 0
pagination_dir: page

# Extensions
theme: stellar

# Deployment is Vercel, which builds from the repository. Nothing to configure.
